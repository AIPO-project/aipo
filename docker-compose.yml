services:
  mysql:
    image: mysql:8.0
    container_name: mysql_aipo
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: ${TZ}
    ports:
      - ${MYSQL_HOST_PORT}:${MYSQL_CONTAINER_PORT}
    volumes:
      - mysql_data:/var/lib/mysql
      # arquivos .sql/.sql.gz desta pasta rodam UMA vez, na criação do banco
      - ./db-init:/docker-entrypoint-initdb.d:ro
    networks:
      - database_network

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mqtt-broker:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped

    ports:
      - "1883:1883"

    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

    networks:
      - app_network

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile.dev
    # env_file: .env
    ports:
      - "5000:5000"
    restart: unless-stopped
    environment:
      
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_PORT: ${MYSQL_CONTAINER_PORT}
      MYSQL_HOST: ${MYSQL_HOST}

      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      MQTT_API_TOKEN: ${MQTT_API_TOKEN}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app_network
      - database_network
    # Não publica porta: só o nginx do frontend enxerga o backend.
    # Descomente apenas se o backend precisar ler a leitora serial NO servidor
    # (hoje a leitura é feita pelo processo local em 127.0.0.1:8000, então não precisa):
    # devices:
    #   - /dev/ttyUSB0:/dev/ttyUSB0

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
      # Para HTTPS, veja frontend/nginx-ssl.conf e o bloco "volumes" comentado abaixo
      # - "443:443"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      # ajuda bastante em Linux/WSL para o watcher
      CHOKIDAR_USEPOLLING: "true"
      REACT_APP_API_URL: ${REACT_APP_API_URL}
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - app_network

  mqtt-service:
    build:
      context: ./mqttService
      dockerfile: Dockerfile.dev

    container_name: aipo_mqtt_service

    restart: unless-stopped

    environment:
      MQTT_BROKER: ${MQTT_BROKER_SECONDARY_HOST}
      MQTT_LOGIN: ${MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      MQTT_TOPIC_ACESSO: ${MQTT_TOPIC_ACESSO}
      MQTT_API_TOKEN: ${MQTT_API_TOKEN}

      # MYSQL_HOST: mysql
      # MYSQL_PORT: 3306
      # MYSQL_DATABASE: ${MYSQL_DATABASE}
      # MYSQL_USER: ${MYSQL_USER}
      # MYSQL_PASSWORD: ${MYSQL_PASSWORD}

      PYTHONUNBUFFERED: "1"

    depends_on:
      - mqtt-broker


    networks:
      - database_network
      - app_network

volumes:
  mysql_data:
  mosquitto_data:
  mosquitto_log:
  frontend_node_modules:

networks:
  app_network:
    driver: bridge

  database_network:
    driver: bridge
    internal: true