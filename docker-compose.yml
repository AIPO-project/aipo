services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: America/Fortaleza
    volumes:
      - dbdata:/var/lib/mysql
      # arquivos .sql/.sql.gz desta pasta rodam UMA vez, na criação do banco
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      # sobrescreve o que estiver no .env: dentro do compose o banco é o serviço "db"
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      TZ: America/Fortaleza
    depends_on:
      db:
        condition: service_healthy
    # Não publica porta: só o nginx do frontend enxerga o backend.
    # Descomente apenas se o backend precisar ler a leitora serial NO servidor
    # (hoje a leitura é feita pelo processo local em 127.0.0.1:8000, então não precisa):
    # devices:
    #   - /dev/ttyUSB0:/dev/ttyUSB0

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      # Para HTTPS, veja frontend/nginx-ssl.conf e o bloco "volumes" comentado abaixo
      # - "443:443"
    # volumes:
    #   - ./certs:/etc/nginx/certs:ro
    #   - ./frontend/nginx-ssl.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  dbdata:
