services:

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile.prod

    restart: unless-stopped
    
    environment:  

      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_PORT: ${MYSQL_CONTAINER_PORT}
      MYSQL_HOST: ${MYSQL_HOST}

      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      MQTT_API_TOKEN: ${MQTT_API_TOKEN}
    networks:
      app_network:
      database_network:
      proxy_net:
        aliases:
          - aipo-backend
    # Não publica porta: só o nginx do frontend enxerga o backend.
    # Descomente apenas se o backend precisar ler a leitora serial NO servidor
    # (hoje a leitura é feita pelo processo local em 127.0.0.1:8000, então não precisa):
    # devices:
    #   - /dev/ttyUSB0:/dev/ttyUSB0

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    environment:
      REACT_APP_API_URL: ${REACT_APP_API_URL}
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      app_network:
      proxy_net:
        aliases:
          - aipo-frontend

networks:
  app_network:
    driver: bridge

  database_network:
    external: true
    name: database_network

  proxy_net:
    external: true
    name: supercampus_proxy
